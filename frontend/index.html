<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TradeCommit — Trading journal, trade planner, performance analytics, and weekly AI mentor review." />
    <meta name="application-name" content="TradeCommit" />
    <meta name="theme-color" id="tc-theme-color" content="#dfddd6" />
    <meta name="theme-color" content="#dfddd6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TradeCommit" />
    <title>TradeCommit</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tradecommit-theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.getElementById("tc-theme-color");
          if (meta) meta.setAttribute("content", dark ? "#111111" : "#dfddd6");
        } catch (e) {}
        window.__deferredInstallPrompt = null;
        window.addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          window.__deferredInstallPrompt = event;
        });
      })();
    </script>
    <script>
      // Start the first API calls now, while the JS bundle is still downloading. The app picks these
      // requests up instead of starting its own (see src/utils/prefetch.js). Same-origin, so cookies are sent.
      (function () {
        if (location.pathname.indexOf("/auth") === 0) return;
        var get = function (url) {
          return fetch(url, { credentials: "include" }).catch(function () { return null; });
        };
        window.__prefetch = {
          auth: get("/api/v1/auth/check"),
          journals: get("/api/v1/journals"),
          planners: get("/api/v1/planners"),
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
