<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeCommit</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tradecommit-theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <script>
      // Start the first API calls now, while the JS bundle is still downloading. The app picks these
      // requests up instead of starting its own (see src/utils/prefetch.js). Same-origin, so cookies are sent.
      (function () {
        if (location.pathname.indexOf("/auth") === 0) return;
        var get = function (url) {
          return fetch(url, { credentials: "include" }).catch(function () { return null; });
        };
        window.__prefetch = {
          auth: get("/api/v1/auth/check"),
          journals: get("/api/v1/journals"),
          planners: get("/api/v1/planners"),
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
